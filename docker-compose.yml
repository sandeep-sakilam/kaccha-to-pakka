# Local and single-VPS stack: API, worker, Postgres, Redis, web.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ktp
      POSTGRES_PASSWORD: ktp
      POSTGRES_DB: ktp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ktp:ktp@db:5432/ktp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
    volumes: ["filestore:/app/var"]

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ktp:ktp@db:5432/ktp
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    volumes: ["filestore:/app/var"]

  web:
    build: ./web
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  filestore:
